<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        color: var(--vscode-foreground);
        font-family: var(--vscode-font-family);
        text-align: center;
      }

      .pet-image {
        width: 160px;
        height: 160px;
        margin-top: 24px;
        object-fit: contain;
        image-rendering: pixelated;
      }

      .hunger {
        margin: 20px 16px 12px;
        font-size: 14px;
        font-weight: 600;
      }

      .hunger-bar {
        height: 8px;
        margin: 0 16px 20px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--vscode-progressBar-background);
      }

      .hunger-bar__fill {
        width: 100%;
        height: 100%;
        background: var(--vscode-button-background);
      }

      .feed-button {
        width: calc(100% - 32px);
        margin: 0 16px;
        padding: 8px 12px;
        border: 0;
        border-radius: 4px;
        color: var(--vscode-button-foreground);
        background: var(--vscode-button-background);
        cursor: pointer;
        font: inherit;
      }

      .feed-button:hover {
        background: var(--vscode-button-hoverBackground);
      }
    </style>
  </head>
  <body>
    <img class="pet-image" src="{{petImageUri}}" alt="물쐉이" />

    <h2>물쐉이</h2>

    <p class="hunger">배고픔: 10 / 10</p>
    <div
      class="hunger-bar"
      role="progressbar"
      aria-label="배고픔"
      aria-valuemin="0"
      aria-valuemax="10"
      aria-valuenow="10"
    >
      <div class="hunger-bar__fill"></div>
    </div>

    <button class="feed-button" type="button">먹이 주기</button>
  </body>
</html>
