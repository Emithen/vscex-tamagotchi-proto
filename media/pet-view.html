<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        color: var(--vscode-foreground);
        font-family: var(--vscode-font-family);
        text-align: center;
      }

      .pet-image {
        width: 160px;
        height: 160px;
        margin-top: 24px;
        object-fit: contain;
        image-rendering: pixelated;
      }

      .hunger {
        margin: 20px 16px 12px;
        font-size: 14px;
        font-weight: 600;
      }

      .hunger-bar {
        height: 8px;
        margin: 0 16px 20px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--vscode-progressBar-background);
      }

      .hunger-bar__fill {
        width: 100%;
        height: 100%;
        background: var(--vscode-button-background);
      }

      .hunger-bar__fill--0 { width: 0%; }
      .hunger-bar__fill--1 { width: 10%; }
      .hunger-bar__fill--2 { width: 20%; }
      .hunger-bar__fill--3 { width: 30%; }
      .hunger-bar__fill--4 { width: 40%; }
      .hunger-bar__fill--5 { width: 50%; }
      .hunger-bar__fill--6 { width: 60%; }
      .hunger-bar__fill--7 { width: 70%; }
      .hunger-bar__fill--8 { width: 80%; }
      .hunger-bar__fill--9 { width: 90%; }
      .hunger-bar__fill--10 { width: 100%; }

      .feed-button {
        width: calc(100% - 32px);
        margin: 0 16px;
        padding: 8px 12px;
        border: 0;
        border-radius: 4px;
        color: var(--vscode-button-foreground);
        background: var(--vscode-button-background);
        cursor: pointer;
        font: inherit;
      }

      .feed-button:hover {
        background: var(--vscode-button-hoverBackground);
      }
    </style>
  </head>
  <body>
    <img class="pet-image" src="{{petImageUri}}" alt="{{petName}}" />

    <h2>{{petName}}</h2>

    <p class="hunger">배고픔: {{hunger}} / 10</p>
    <div
      class="hunger-bar"
      role="progressbar"
      aria-label="배고픔"
      aria-valuemin="0"
      aria-valuemax="10"
      aria-valuenow="{{hunger}}"
    >
      <div
        class="hunger-bar__fill {{hungerClass}}"
      ></div>
    </div>

    <button class="feed-button" type="button">먹이 주기</button>
  </body>
</html>
